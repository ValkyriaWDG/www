name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_present: ${{ steps.stage.outputs.app_present }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-foundation.mjs
      - run: node --test scripts/tests/*.test.mjs
      - name: Verify encrypted backup recovery with pinned restic
        shell: bash
        env:
          BACKUP_PROOF_REPORT_PATH: .local/encrypted-backup/report.json
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 \
            --output "$tool_dir/restic.bz2"
          printf '%s  %s\n' f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c "$tool_dir/restic.bz2" | sha256sum --check --strict
          bunzip2 "$tool_dir/restic.bz2"
          chmod +x "$tool_dir/restic"
          RESTIC_TEST_BIN="$tool_dir/restic" node --test scripts/tests/encrypted-backup.integration.mjs
      - name: Upload encrypted recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: encrypted-recovery-${{ github.sha }}
          path: .local/encrypted-backup/report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Check attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/check-commit-attribution.mjs "$BASE_SHA..$HEAD_SHA"
          else
            node scripts/check-commit-attribution.mjs "$HEAD_SHA"
          fi
      - name: Detect implementation stage
        id: stage
        run: |
          if [ -f apps/web/package.json ]; then
            echo 'app_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app_present=false' >> "$GITHUB_OUTPUT"
            echo 'Foundation only: application, database, browser and container checks are not yet applicable.' >> "$GITHUB_STEP_SUMMARY"
          fi

  application:
    name: Application
    needs: foundation
    if: needs.foundation.outputs.app_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ephemeral
          POSTGRES_DB: valkyria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d valkyria_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test-only-ephemeral@localhost:5432/valkyria_test
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-ephemeral-secret-not-for-production-0000
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: valkyria-web:ci
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: false
          sbom: false
      - name: Build comparison runtime from identical application inputs
        run: |
          BASELINE_RUNTIME=$(node -p "JSON.parse(require('fs').readFileSync('scripts/release/runtime-policy.json')).baselineRuntime")
          docker build --file apps/web/Dockerfile --build-arg SOURCE_REVISION=${{ github.sha }} --build-arg RUNTIME_IMAGE="$BASELINE_RUNTIME" --tag valkyria-web:bookworm .
      - name: Disposable runtime, native sharp and previous-image rollback rehearsal
        run: node scripts/release/rehearse-images.mjs
      - name: Upload image and rollback rehearsal
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-${{ github.sha }}
          path: .local/release-hardening/images/report.json
          if-no-files-found: warn
          retention-days: 90
      - name: Container startup, migration and health smoke test
        env:
          SMOKE_DATABASE_URL: postgresql://test:test-only-ephemeral@localhost:5432/valkyria_container
        run: |
          set -euo pipefail
          PGPASSWORD=test-only-ephemeral psql -h localhost -U test -d valkyria_test -c 'create database valkyria_container'
          docker run --rm --network host -e DATABASE_URL="$SMOKE_DATABASE_URL" valkyria-web:ci node scripts/migrate.mjs
          docker run --rm --network host -e DATABASE_URL="$SMOKE_DATABASE_URL" valkyria-web:ci node scripts/migrate.mjs
          docker run -d --name smoke --network host --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v smoke-media:/app/storage/editorial \
            -e PORT=3300 -e APP_URL=http://127.0.0.1:3300 -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e BETTER_AUTH_SECRET=ci-only-ephemeral-secret-not-for-production-0000 valkyria-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3300/api/health/live && break; sleep 1; done
          curl -fsS http://127.0.0.1:3300/api/health/ready
          test "$(docker exec smoke id -u)" != 0
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/)" = 307
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke
      - name: Image vulnerability scan (fixable HIGH/CRITICAL findings fail)
        run: |
          set -euo pipefail
          mkdir -p .local/release-hardening/scans
          TRIVY_IMAGE=$(node -p "JSON.parse(require('fs').readFileSync('scripts/release/runtime-policy.json')).trivyImage")
          for variant in bookworm ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.local/release-hardening/scans:/out" \
              -v release-trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" \
              image --scanners vuln --severity HIGH,CRITICAL --list-all-pkgs --format json --output "/out/$variant.json" --no-progress "valkyria-web:$variant"
          done
          node scripts/release/runtime-scan.mjs .local/release-hardening/scans/bookworm.json .local/release-hardening/scans/ci.json .local/release-hardening/scans/comparison.json
      - name: Upload complete runtime advisory comparison
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-scans-${{ github.sha }}
          path: .local/release-hardening/scans/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Image SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            mirror.gcr.io/aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --format cyclonedx --output /out/valkyria-web.cdx.json --no-progress valkyria-web:ci
      - name: Upload image SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom/valkyria-web.cdx.json
          retention-days: 90
      - run: pnpm --filter @valkyria/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Cold mobile page-weight and Web Vitals budgets
        run: node scripts/release/measure-pages.mjs
      - name: Upload page budget samples and synthetic screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: page-budgets-${{ github.sha }}
          path: |
            .local/release-hardening/pages/report.json
            .local/release-hardening/pages/page-*.png
          if-no-files-found: warn
          retention-days: 90
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: Quality gate
    needs: [foundation, application]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          APP_PRESENT: ${{ needs.foundation.outputs.app_present }}
          APP_RESULT: ${{ needs.application.result }}
        run: |
          test "$FOUNDATION_RESULT" = success
          if [ "$APP_PRESENT" = true ]; then
            test "$APP_RESULT" = success
          else
            test "$APP_RESULT" = skipped
          fi
