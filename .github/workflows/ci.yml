name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app_present: ${{ steps.stage.outputs.app_present }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/check-foundation.mjs
      - run: node --test scripts/tests/*.test.mjs
      - name: Check attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            node scripts/check-commit-attribution.mjs "$BASE_SHA..$HEAD_SHA"
          else
            node scripts/check-commit-attribution.mjs "$HEAD_SHA"
          fi
      - name: Detect implementation stage
        id: stage
        run: |
          if [ -f apps/web/package.json ]; then
            echo 'app_present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app_present=false' >> "$GITHUB_OUTPUT"
            echo 'Foundation only: application, database, browser and container checks are not yet applicable.' >> "$GITHUB_STEP_SUMMARY"
          fi

  application:
    name: Application
    needs: foundation
    if: needs.foundation.outputs.app_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ephemeral
          POSTGRES_DB: valkyria_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d valkyria_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test-only-ephemeral@localhost:5432/valkyria_test
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-ephemeral-secret-not-for-production-0000
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm --filter @valkyria/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload browser report and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Build image without publishing
        run: docker build --file apps/web/Dockerfile --build-arg SOURCE_REVISION=${{ github.sha }} --tag valkyria-web:ci .
      - name: Container startup, migration and health smoke test
        env:
          SMOKE_DATABASE_URL: postgresql://test:test-only-ephemeral@localhost:5432/valkyria_container
        run: |
          set -euo pipefail
          PGPASSWORD=test-only-ephemeral psql -h localhost -U test -d valkyria_test -c 'create database valkyria_container'
          docker run --rm --network host -e DATABASE_URL="$SMOKE_DATABASE_URL" valkyria-web:ci node scripts/migrate.mjs
          docker run --rm --network host -e DATABASE_URL="$SMOKE_DATABASE_URL" valkyria-web:ci node scripts/migrate.mjs
          docker run -d --name smoke --network host --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -v smoke-media:/app/storage/editorial \
            -e PORT=3300 -e APP_URL=http://127.0.0.1:3300 -e DATABASE_URL="$SMOKE_DATABASE_URL" \
            -e BETTER_AUTH_SECRET=ci-only-ephemeral-secret-not-for-production-0000 valkyria-web:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3300/api/health/live && break; sleep 1; done
          curl -fsS http://127.0.0.1:3300/api/health/ready
          test "$(docker exec smoke id -u)" != 0
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3300/)" = 307
          docker logs smoke 2>&1 | tail -20
          docker rm -f smoke
      - name: Image vulnerability scan (fixable HIGH/CRITICAL findings fail)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            mirror.gcr.io/aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress valkyria-web:ci
      - name: Image SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            mirror.gcr.io/aquasec/trivy@sha256:e2b22eac59c02003d8749f5b8d9bd073b62e30fefaef5b7c8371204e0a4b0c08 \
            image --format cyclonedx --output /out/valkyria-web.cdx.json --no-progress valkyria-web:ci
      - name: Upload image SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/valkyria-web.cdx.json
          retention-days: 90

  bot-management-contract:
    name: Bot management contract
    needs: foundation
    if: needs.foundation.outputs.app_present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ephemeral
          POSTGRES_DB: valkyria_bot_contract_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d valkyria_bot_contract_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test-only-ephemeral@localhost:5432/valkyria_bot_contract_test
      BOT_SOURCE_DIR: ${{ github.workspace }}/.local/contract-bot
      CI: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check out the actual pinned bot implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ValkyriaWDG/bot
          ref: 4f3db011ec0aa96eaaa96bfb7b71cd4bffd804ac
          path: .local/contract-bot
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify real bot HTTP, persistence and web authorization contract
        run: pnpm --filter @valkyria/web exec vitest run --config vitest.bot-contract.config.ts
      - name: Record tested source identities
        if: always()
        run: |
          printf 'Website checkout: `%s`\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Actual bot checkout: `%s`\n' "$(git -C "$BOT_SOURCE_DIR" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality gate
    needs: [foundation, application, bot-management-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all applicable checks
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          APP_PRESENT: ${{ needs.foundation.outputs.app_present }}
          APP_RESULT: ${{ needs.application.result }}
          BOT_MANAGEMENT_RESULT: ${{ needs.bot-management-contract.result }}
        run: |
          test "$FOUNDATION_RESULT" = success
          if [ "$APP_PRESENT" = true ]; then
            test "$APP_RESULT" = success
            test "$BOT_MANAGEMENT_RESULT" = success
          else
            test "$APP_RESULT" = skipped
            test "$BOT_MANAGEMENT_RESULT" = skipped
          fi
