name: Release

# A `vX.Y.Z` tag on main re-runs the full CI (including the container build, scan and SBOM)
# and then creates the GitHub release from the matching CHANGELOG.md section. It does not
# publish a container image or deploy; see the gated "Publish container" workflow.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    name: GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a tag on main that matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(node -p "require('./package.json').version")" = "$TAG"
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.TAG.slice(1);
            const section = fs.readFileSync("CHANGELOG.md", "utf8").split(/^## /m).find((part) => part.startsWith(`${version} `));
            if (!section) { console.error(`CHANGELOG.md has no ${version} section`); process.exit(1); }
            fs.writeFileSync("release-notes.md", `${section.split("\n").slice(1).join("\n").trim()}\n`);
          '
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "Valkyria web $TAG" --notes-file release-notes.md
