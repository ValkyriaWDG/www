name: Publish container

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Accepted full main commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.CONTAINER_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.CONTAINER_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: container-publish
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require the accepted revision before registry access
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/check-release-revision.mjs
      - name: Require real implementation and registry configuration
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          test -f apps/web/package.json
          test -f apps/web/Dockerfile
          test -n "$IMAGE_NAME"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish immutable revision
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}
          provenance: mode=min
          sbom: true
      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Published digest $IMAGE_DIGEST; no deployment or mutable production tag was performed." >> "$GITHUB_STEP_SUMMARY"
