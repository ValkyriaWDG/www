name: Publish container

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Accepted full main commit SHA to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-container
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.CONTAINER_PUBLISH_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.CONTAINER_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: container-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require the accepted revision before registry access
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/check-release-revision.mjs
      - name: Require real implementation and registry configuration
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          test -f apps/web/package.json
          test -f apps/web/Dockerfile
          test -n "$IMAGE_NAME"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish immutable revision
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ vars.DOCKERHUB_IMAGE }}:sha-${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          provenance: mode=min
          sbom: true
      - name: Verify published digest and accepted source revision
        shell: bash
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$EXPECTED_SHA"
          docker pull "$IMAGE_NAME@$IMAGE_DIGEST"
          test "$(docker image inspect "$IMAGE_NAME@$IMAGE_DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          printf 'Verified immutable image %s@%s from accepted revision %s. Production promotion is reported separately below.\n' "$IMAGE_NAME" "$IMAGE_DIGEST" "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Promote compatible image to the Watchtower production channel
        if: vars.WATCHTOWER_PROMOTION_ENABLED == 'true'
        id: promotion
        env:
          IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node scripts/release/production-channel.mjs
      - name: Record disabled production promotion
        if: vars.WATCHTOWER_PROMOTION_ENABLED != 'true'
        run: echo 'Production promotion is disabled. Only the immutable image was published; no deployment or mutable tag update was performed.' >> "$GITHUB_STEP_SUMMARY"
