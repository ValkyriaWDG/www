# Disposable local development database only. Bound to loopback; synthetic data only.
# Usage: docker compose -f infra/compose.dev.yaml up -d
# DATABASE_URL=postgresql://valkyria_dev:dev-only-local@127.0.0.1:5432/valkyria_dev
name: valkyria-dev
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: valkyria_dev
      POSTGRES_PASSWORD: dev-only-local
      POSTGRES_DB: valkyria_dev
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U valkyria_dev -d valkyria_dev]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dev-postgres:
